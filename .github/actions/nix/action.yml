name: Provide nix
description: >-
  Give the job nix, the fleet binary cache, and the credential for github inputs the
  runner cannot fetch anonymously, and leave nix itself alone on a runner that already
  configures it.

inputs:
  token:
    description: >-
      Attic token scoped to pull and push the fleet cache, passed to the cache step.
      Without a usable token the run substitutes from the public cache and pushes
      nothing.
    required: false
    default: ""
  github-token:
    description: >-
      Credential for the github inputs a flake locks, handed to later steps through
      NIX_CONFIG, the setting being client-side. Nothing is handed over when it does not
      resolve: GitHub refuses a request carrying an empty access token, even for a public
      repository, so a repository without the secret keeps fetching what it can reach.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: inputs.github-token != ''
      shell: bash
      env:
        ACCESS_TOKEN: ${{ inputs.github-token }}
      run: |
        printf 'NIX_CONFIG=access-tokens = github.com=%s\n' "$ACCESS_TOKEN" >>"$GITHUB_ENV"
    # A step cannot test a command in its own condition, so the test is its own step and
    # the two steps that follow read its output.
    - id: nix
      shell: bash
      run: |
        if command -v nix >/dev/null 2>&1; then
          printf 'provided=%s\n' true >>"$GITHUB_OUTPUT"
        else
          printf 'provided=%s\n' false >>"$GITHUB_OUTPUT"
        fi
    # A runner the repository owns brings its own nix and its own cache configuration, and
    # rewriting the nix configuration of a machine the job does not own is not a job's work.
    - if: steps.nix.outputs.provided == 'false'
      uses: cachix/install-nix-action@v31
    - if: steps.nix.outputs.provided == 'false'
      uses: jgus-org/flake-lib/.github/actions/fleet-nix-cache@v1
      with:
        token: ${{ inputs.token }}
