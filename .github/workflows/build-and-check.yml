# The gate a pull request has to pass: build every package this flake publishes for the
# runner's system, build the throwaway copy of whatever its overlay produces, then `nix flake
# check`. No step covers another -- the check builds `checks` and only looks at the shape of
# `packages`, building `packages` says nothing about a `checks` entry that stopped building, and a
# payload that only exists once a consumer applies the overlay is realized by neither. Every step
# runs even when an earlier one fails, so a run names every problem in a tree rather than the
# first one nix reached. A package the runner cannot build sets `passthru.ciBuildSkip = true` with
# the reason beside it, and the run names every package it skipped. A flake that publishes nothing
# buildable for the runner's system and declares no overlay smoke target says so and passes, which
# is why every published flake installs this gate whatever it publishes.
#
# The publication path runs this same command, so what a producer pushes is what a pull
# request would have gated, and no path names the attribute it builds.
#
# Nothing here is producer-specific, so `nix run
# github:jgus-org/flake-lib/v1#update-workflows` replaces this file wholesale; a repository
# that does not have it installs it with `-- adopt build-and-check.yml`. Edit it in
# jgus-org/flake-lib's templates/workflows. Binary caching uses the fleet Attic cache
# whenever ATTIC_TOKEN resolves -- an organization secret covers every repository at once --
# and a repository or fork pull request with no token runs on the public cache alone. Nix
# fetches a github input anonymously, so a flake that locks a private repository needs
# BUILD_TOKEN, and a repository without it runs on the public inputs it can fetch.
#
# A gate runs on a hosted runner unless the repository sets the `RUNNER` variable to a
# label one of its own runners carries.

name: Build and Check

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-and-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Build what this flake publishes, build its overlay's smoke target, check the flake
        run: nix run github:jgus-org/flake-lib/v1#build-and-check
