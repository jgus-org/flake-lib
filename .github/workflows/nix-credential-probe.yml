name: Probe nix github credential
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix

      - name: Handover
        run: |
          echo "--- access-tokens as nix sees it"
          nix config show access-tokens | sed -E 's/=(.).*/=<set>/'
          echo "--- a caller that hands nothing over still has a token"
          if nix config show access-tokens | grep -qE '^[[:space:]]*github\.com=.'; then
            echo "github.com credential: set"
          else
            echo "github.com credential: unset"
            exit 1
          fi

      - name: Foreign public input resolves
        run: |
          set +e
          out=$(nix flake metadata --refresh 'github:octocat/Spoon-Knife' 2>&1)
          code=$?
          printf '%s\n' "${out}" | head -20
          printf 'exit=%s\n' "${code}"
          if printf '%s\n' "${out}" | grep -qiE 'rate limit|403|401'; then
            echo "the API refused the credential"
            exit 1
          fi

      - name: Sibling public flake resolves
        run: nix flake metadata --refresh 'github:jgus-org/tiddl-flake' | head -6

      - name: Empty credential is refused not anonymous
        run: |
          set +e
          NIX_CONFIG='access-tokens = github.com=' nix flake metadata --refresh \
            'github:octocat/Spoon-Knife' 2>&1 | grep -iE '401|403|Bad credentials|rate limit' | head -4
