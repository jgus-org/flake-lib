# flake-lib's own sweep of the fleet, not a template: no producer installs this file, and no
# producer's workflow changes because of it. scripts/updater_health.py says what it judges and
# why, including why a red run here means the sweep is broken rather than a producer being red.
name: Producer updater health

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: updater-health
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Sweep the fleet's update workflows
        env:
          # Reads prefer this organization secret, which sees the fleet's private producers.
          # With no such secret the sweep reads the public ones and says how many it swept.
          GH_TOKEN: ${{ secrets.ORG_UPDATE_TOKEN }}
          # The tracking issue lives in this repository, which the run's own token writes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#updater-health -- --report-issue
