# Rewritten wholesale by `nix run github:jgus-org/flake-lib/v1#update-workflows`. Edit it in jgus-org/flake-lib's templates/workflows, not here.

name: Update branches

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # A producer whose flake takes inputs from other producers must not pin them before their own update has published. The edges are this repository's flake inputs, so nothing below is producer-specific, and a leaf producer's run reports nothing to wait for. A dependency that cannot be observed, that ended badly, or that never finishes is reported and skipped: ordering is worth waiting for, not worth stalling the fleet on.
  deps:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Wait for dependency updates
        env:
          # Reading another repository's runs and starting a dependency's update both need a token. This organization secret covers every repository, so no producer declares anything. With no such secret the gate observes nothing and proceeds.
          GITHUB_TOKEN: ${{ secrets.ORG_UPDATE_TOKEN }}
        run: nix run github:jgus-org/flake-lib/v1#wait-for-deps

  discover:
    needs: deps
    # A dependency that failed is worth continuing past: ordering is best effort. A run that is being cancelled is not: GitHub schedules this job and never dispatches it, so the run queues forever and holds the concurrency group every later update waits behind.
    if: "!cancelled()"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Discover tracked versions and specification base
        id: plan
        env:
          # gh CLI reads GH_TOKEN, not GITHUB_TOKEN, and a github-source flake needs it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#update-branches -- list

  maintenance:
    needs: discover
    if: "!cancelled() && needs.discover.result == 'success' && needs.discover.outputs.versions != '[]'"
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        entry: ${{ fromJson(needs.discover.outputs.versions) }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Refresh exact version
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          VERSION: ${{ matrix.entry.version }}
          UPSTREAM_VERSION: ${{ matrix.entry.upstreamVersion }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run .#update-branches -- refresh \
            --base-sha "${BASE_SHA}" \
            --version "${VERSION}" \
            --upstream-version "${UPSTREAM_VERSION}"

  publish:
    needs: [discover, maintenance]
    if: "!cancelled() && needs.discover.result == 'success'"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Publish aggregate pointers
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ needs.discover.outputs.versions }}
        run: |
          nix run .#update-branches -- publish \
            --base-sha "${BASE_SHA}" \
            --versions-json "${VERSIONS}"
