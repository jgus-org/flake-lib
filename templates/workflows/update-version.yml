# Update workflow for a producer whose upstream has no named releases: the published pin is the revision the branch currently names, and the history of previous versions is this branch's own commit log. A producer that tracks named releases gets templates/workflows/update-branches.yml instead of this one.
#
# Rewritten wholesale by `nix run github:jgus-org/flake-lib/v1#update-workflows`. Edit it in jgus-org/flake-lib's templates/workflows, not here.
#
# Scratch output the updater leaves behind must be in .gitignore, since staging is unrestricted.

name: Update version

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # A producer whose flake takes inputs from other producers must not pin them before their own update has published. The edges are this repository's flake inputs, so nothing below is producer-specific, and a leaf producer's run reports nothing to wait for. A dependency that cannot be observed, that ended badly, or that never finishes is reported and skipped: ordering is worth waiting for, not worth stalling the fleet on.
  deps:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Wait for dependency updates
        env:
          # Reading another repository's runs and starting a dependency's update both need a token. This organization secret covers every repository, so no producer declares anything. With no such secret the gate observes nothing and proceeds.
          GITHUB_TOKEN: ${{ secrets.ORG_UPDATE_TOKEN }}
        run: nix run github:jgus-org/flake-lib/v1#wait-for-deps

  update:
    needs: deps
    # A dependency that failed is worth continuing past: ordering is best effort. A run that is being cancelled is not: GitHub schedules this job and never dispatches it, so the run queues forever and holds the concurrency group every later update waits behind.
    if: "!cancelled()"
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Bump nixpkgs
        run: nix flake update

      - name: Bump the tracked revision
        env:
          # gh CLI reads GH_TOKEN, not GITHUB_TOKEN, and a github-source flake needs it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#update-version

      # A machine commit that is not formatted leaves the repository failing its own formatting check until a human formats the tree. Formatting comes before the build so the build covers exactly what the commit makes.
      - name: Format what the run changed
        run: nix fmt

      # The updater exits early when the upstream commit has not moved, so this runs unconditionally: nixpkgs can have moved underneath a pin that did not, and a run that only pins files without building them says nothing about the result. The gate is the same command a pull request runs, so one definition proves what this commit contains rather than a second build written out here.
      - name: Run the gate
        run: nix run github:jgus-org/flake-lib/v1#build-and-check

      - name: Commit and push whatever the run changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "auto: bump the tracked revision"
          # The destination is named rather than inferred from HEAD, which is detached whenever the run was dispatched at a commit instead of a branch.
          git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
